<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>What are you looking for? — Job Discovery</title>
  {% include "_field_guide_head.html" %}
  <style>
    body {
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--fg-space-12);
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--fg-space-8);
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: var(--fg-font-size-4xl);
      text-align: center;
    }
    .subtext {
      margin: calc(-1 * var(--fg-space-4)) 0 0;
      font-size: var(--fg-font-size-sm);
    }
    form {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--fg-space-6);
      width: 100%;
    }
    .categories {
      display: flex;
      flex-direction: column;
      gap: var(--fg-space-4);
    }
    .categories .fg-check {
      gap: var(--fg-space-3);
      font-weight: var(--fg-font-weight-medium);
      font-size: var(--fg-font-size-lg);
    }
  </style>
</head>
<body class="fg-page">
  <div class="card">
    <h1 class="fg-display">What are you looking for?</h1>
    <p class="subtext fg-text-secondary">Select any that interest you — leave them all unchecked to see every role we find. You can change this anytime from "Edit roles" on the dashboard.</p>
    <form method="post" action="/onboarding">
      <div class="categories">
        {% for key, cat in categories.items() %}
        <label class="fg-check">
          <input class="fg-checkbox" type="checkbox" name="categories" value="{{ key }}" {{ "checked" if key in selected else "" }}>
          {{ cat.label }}
        </label>
        {% endfor %}
      </div>
      <button class="fg-button fg-button--primary fg-button--block" type="submit">Continue to dashboard</button>
    </form>
  </div>
</body>
</html>
