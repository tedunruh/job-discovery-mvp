<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in — Scout</title>
  {% include "_field_guide_head.html" %}
  <style>
    body {
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--fg-space-6) var(--fg-space-12);
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--fg-space-16);
    }
    .wordmark {
      font-size: var(--fg-font-size-wordmark);
      white-space: nowrap;
    }
    .auth,
    .auth-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--fg-space-6);
    }
    .auth .fg-field,
    .auth .fg-button,
    .auth .fg-message { width: 280px; }
  </style>
</head>
<body class="fg-page">
  <div class="card">
    <h1 class="fg-display wordmark">Scout</h1>
    <div class="auth">
      {% if sent %}
        <p class="fg-message fg-message--success">If that email is on the list, a sign-in link is on its way. It expires in 15 minutes and works once.</p>
      {% elif error %}
        <p class="fg-message fg-message--attention">{{ error }}</p>
      {% endif %}
      <form class="auth-form" method="post" action="/login">
        <div class="fg-field">
          <label class="fg-label" for="email">email</label>
          <input class="fg-input" type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
        </div>
        <button class="fg-button fg-button--primary" type="submit">Send sign-in link</button>
      </form>
    </div>
  </div>
</body>
</html>
