<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in — Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1&family=Lato:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 48px;
      background: #f6f2e9;
      color: #292824;
      font-family: "Avenir Next", Avenir, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 64px;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-variation-settings: "SOFT" 0, "WONK" 1;
      font-weight: 400;
      font-size: 96px;
      letter-spacing: -0.96px;
      margin: 0;
      color: #292824;
      white-space: nowrap;
    }
    .auth {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 280px;
    }
    .field label {
      padding: 0 12px;
      font-family: "Lato", sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.16px;
      color: #292824;
    }
    .field input[type="email"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-family: "Avenir Next", Avenir, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      color: #292824;
      background: #fff;
      border: 1px solid #858683;
      border-radius: 4px;
    }
    .field input[type="email"]::placeholder { color: rgba(41, 40, 36, 0.45); }

    .signin-btn {
      width: 280px;
      box-sizing: border-box;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      color: #292824;
      background: rgba(41, 40, 36, 0.1);
      border: 1px solid #94918c;
      border-radius: 8px;
      padding: 8px 13px;
      cursor: pointer;
    }
    .signin-btn:hover { background: rgba(41, 40, 36, 0.16); }

    .msg {
      width: 280px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
    }
    .msg.sent { background: rgba(53, 84, 71, 0.12); color: #355447; }
    .msg.error { background: rgba(167, 38, 25, 0.1); color: #7a2719; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scout</h1>
    <div class="auth">
      {% if sent %}
        <p class="msg sent">If that email is on the list, a sign-in link is on its way. It expires in 15 minutes and works once.</p>
      {% elif error %}
        <p class="msg error">{{ error }}</p>
      {% endif %}
      <form class="auth-form" method="post" action="/login">
        <div class="field">
          <label for="email">email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
        </div>
        <button class="signin-btn" type="submit">Send sign-in link</button>
      </form>
    </div>
  </div>
</body>
</html>
