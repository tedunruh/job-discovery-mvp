<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in — Job Discovery</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { max-width: 360px; width: 100%; padding: 2rem; }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    input[type="email"] { width: 100%; padding: 0.5rem 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 0.75rem; }
    button { width: 100%; padding: 0.6rem; font-size: 1rem; cursor: pointer; }
    .msg { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
    .msg.sent { background: #e6f4ea; color: #1e4620; }
    .msg.error { background: #fce8e6; color: #7a271a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Job Discovery</h1>
    {% if sent %}
      <p class="msg sent">If that email is on the list, a sign-in link is on its way. It expires in 15 minutes and works once.</p>
    {% elif error %}
      <p class="msg error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <input type="email" name="email" placeholder="you@example.com" required autofocus>
      <button type="submit">Send sign-in link</button>
    </form>
  </div>
</body>
</html>
