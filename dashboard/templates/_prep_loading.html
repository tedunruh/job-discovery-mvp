{#- The panel the moment a card is clicked, before the server's answer arrives (SC-72): the job's own monogram, company and
    title (copied from its card by js/panel.js), and quiet placeholder lines. Replaced whole by _prep_panel.html. -#}
<div class="fg-panel-head">
  <span class="fg-mono fg-mono--sage" aria-hidden="true" data-loading-mono></span>
  <p class="fg-panel-company" data-loading-company></p>
  <h2 class="fg-panel-title" data-loading-title></h2>
  <button class="fg-icon-button" type="button" aria-label="Close" data-panel-close><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3.5 3.5l11 11M14.5 3.5l-11 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</div>
<div class="fg-panel-body" role="status" aria-busy="true">
  <span class="fg-visually-hidden">Opening this job…</span>
  <div class="fg-panel-work" aria-hidden="true"><span class="fg-skeleton"></span><span class="fg-skeleton"></span><span class="fg-skeleton"></span><span class="fg-skeleton"></span></div>
</div>
