{% import "_fg.html" as fg %}
{#- SC-63. The two things a row's action spot can say. They are drawn on the server for the rows that need them and also sit
    in <template>s, which field-guide/js/return.js copies when a tab regains focus, so the page and the script never
    disagree on markup. -#}
{% macro apply_button(id) -%}
<a class="fg-button fg-button--secondary" href="/open/{{ id }}" target="_blank" rel="noopener" data-apply>Apply<span class="fg-visually-hidden"> (opens the posting in a new tab)</span></a>
{%- endmacro %}
{% macro ask_actions(id) -%}
<p class="fg-voice row-q">Did you apply?</p>
<form method="post" action="/set_applied/{{ id }}" data-ask-yes><input type="hidden" name="applied" value="true"><button class="fg-button fg-button--secondary" type="submit">Yes</button></form>
<form method="post" action="/ask/dismiss/{{ id }}" data-ask-dismiss><button class="fg-button fg-button--secondary" type="submit">Not yet</button></form>
{%- endmacro %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scout</title>
  {% include "_field_guide_head.html" %}
  <script src="/field-guide/js/filter.js" defer></script>
  <script src="/field-guide/js/toast.js" defer></script>
  <script src="/field-guide/js/return.js" defer></script>
  <style>
    /* Layout follows Figma "Scout Job Discovery Dashboard" (226:849): a Sage band
       with topographic contours behind the header, then the list on the page surface inside a raised board. Each
       job is its own bordered card (Figma 355:1272). Page inset is 16px at the sides and 24px at the bottom; the page
       header sets the top. */
    body {
      position: relative;
      padding: 0 var(--fg-space-4) var(--fg-space-6); /* the page header sets the top space, as on every page */
    }
    body > :not(.band):not(.fg-toast-region) { position: relative; z-index: 1; }

    /* Decorative band: full width, 277px tall (Figma frame 226:850), clips the
       contours. The contour artwork keeps its Figma offset from the right edge. */
    .band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 277px;
      overflow: hidden;
      background: var(--fg-color-signal-support-subtle);
      pointer-events: none;
    }
    .topography {
      position: absolute;
      top: -28.5px;
      right: -92px;
      color: var(--fg-color-signal-attention-subtle);
    }

    /* The page header (fg.header) lines up with the content inside the board. */
    body > .fg-header { padding-inline: var(--fg-space-6); }

    .board {
      margin-top: calc(var(--fg-space-8) + var(--fg-space-1));
      padding: var(--fg-space-2) var(--fg-space-6) var(--fg-space-6);
      background: var(--fg-color-surface-page);
      border-radius: var(--fg-radius-xl);
      box-shadow: var(--fg-shadow-raised);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--fg-space-3) var(--fg-space-4);
      padding-bottom: var(--fg-space-2);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--fg-space-2);
    }
    .role-count {
      margin: 0;
      font-size: var(--fg-font-size-sm);
      font-weight: var(--fg-font-weight-medium);
      line-height: var(--fg-font-line-height-snug);
      color: var(--fg-color-text-secondary);
      white-space: nowrap;
    }

    .more {
      display: flex;
      align-items: center;
      gap: var(--fg-space-4);
      margin: var(--fg-space-4) 0 0 var(--fg-space-4);
      font-size: var(--fg-font-size-sm);
    }
    .empty {
      display: flex;
      flex-direction: column;
      gap: var(--fg-space-1);
      margin: 0;
      padding: var(--fg-space-8) var(--fg-space-4);
    }
    .empty-title { font-size: var(--fg-font-size-xl); }
    .empty .fg-card-help { margin: 0; }

    ul.postings {
      list-style: none;
      margin: var(--fg-space-2) 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--fg-space-2);
    }

    /* The job on the left (42%), its state and one action spot on the right (58%). Fractions keep the state line
       aligned across rows even though each <li> is its own grid. The whole row opens the posting: the title link's
       ::after covers the row, and the action spot sits above it. */
    .posting {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      align-items: center;
      column-gap: var(--fg-space-6);
      row-gap: var(--fg-space-3);
      padding: var(--fg-space-4);
      background: var(--fg-color-surface-card);
      border: 1px solid var(--fg-color-border-subtle);
      border-radius: var(--fg-radius-sm);
    }
    .posting[hidden] { display: none; }
    .posting:hover { background: var(--fg-color-surface-hover); }
    .posting:has(.posting-link:focus-visible) {
      outline: 3px solid var(--fg-color-action-focus-ring);
      outline-offset: -3px;
    }
    .posting p {
      margin: 0;
      font-weight: var(--fg-font-weight-medium);
      line-height: var(--fg-font-line-height-snug);
    }
    .posting-lead { min-width: 0; }
    .posting-title { font-size: var(--fg-font-size-lg); max-width: 500px; }
    .posting-link { color: inherit; text-decoration: none; outline: none; }
    .posting-link::after { content: ""; position: absolute; inset: 0; }
    .posting-subline { font-size: var(--fg-font-size-sm); color: var(--fg-color-text-secondary); }
    .posting-source { font-size: var(--fg-font-size-xs); color: var(--fg-color-text-secondary); }
    .posting-skills { font-size: var(--fg-font-size-sm); color: var(--fg-color-text-secondary); }

    .posting-second {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--fg-space-4);
      min-width: 0;
    }
    .posting-state { font-size: var(--fg-font-size-sm); color: var(--fg-color-text-secondary); }
    /* Apply, or the question that replaces it when you come back from the job. */
    .row-action {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: var(--fg-space-2);
    }
    .row-action form { display: contents; }
    .row-q { font-size: var(--fg-font-size-lg); margin-right: var(--fg-space-1); }

    @media (max-width: 680px) {
      body > .fg-header { padding-inline: 0; }
      .board { margin-top: var(--fg-space-4); padding: var(--fg-space-1) var(--fg-space-3) var(--fg-space-3); }
      .posting {
        padding: var(--fg-space-3);
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "lead" "state" "action";
      }
      .posting-lead { grid-area: lead; }
      .posting-second { display: contents; }
      .posting-state { grid-area: state; }
      .row-action { grid-area: action; justify-content: flex-start; }
      .more { margin-left: var(--fg-space-3); }
    }
  </style>
</head>
<body class="fg-page">
  <div class="band" aria-hidden="true">{% include "_topography.svg" %}</div>
  {% call fg.header(current=True) %}
    <a class="fg-button fg-button--ghost" href="/profile">Role preferences</a>
    <form method="post" action="/logout"><button class="fg-button fg-button--secondary" type="submit">Sign out</button></form>
  {% endcall %}
  <h1 class="fg-visually-hidden">Your jobs</h1>

  <section class="board" aria-label="Your jobs"{% if tab == "open" %} data-return-url="/return.json"{% endif %}>
    {{ fg.tabs("Your jobs", [("Open roles", total, "/", tab == "open"), ("Applications", applications|length, "/?tab=applications", tab == "applications")]) }}
    {#- A live region that is always in the page, so a screen reader hears the question when it appears. -#}
    <p class="fg-visually-hidden" role="status" aria-live="polite" id="return-live"></p>
    <template id="return-apply-template">{{ apply_button("__id__") }}</template>
    <template id="return-ask-template">{{ ask_actions("__id__") }}</template>
    <template id="toast-template">{% call fg.toast("You've applied to this role. You can find it in Applications.") %}<a class="fg-toast-action" href="/?tab=applications">View</a><button class="fg-toast-action" type="button" data-toast-undo>Undo</button>{% endcall %}</template>

    <div role="tabpanel">
    {% if tab == "open" %}
    <div class="toolbar">
      <div class="filters">
        {% call fg.filter("filter-work", "Work type", work_label) %}
          <form class="fg-menu" method="get" action="/">
            <input type="hidden" name="work_set" value="1">
            {% for key, label in work_type_options.items() %}
            <label class="fg-menu-item">
              <input class="fg-checkbox" type="checkbox" name="work" value="{{ key }}" onchange="this.form.submit()" {{ "checked" if key in work_types else "" }}>
              {{ label }}
            </label>
            {% endfor %}
          </form>
        {% endcall %}

        {% call fg.filter("filter-posted", "Posted", ranges[posted_range][1]) %}
          <form class="fg-menu" method="get" action="/">
            {% for key, (label, _, _) in ranges.items() %}
            <label class="fg-menu-item">
              <input class="fg-radio" type="radio" name="range" value="{{ key }}" onchange="this.form.submit()" {{ "checked" if key == posted_range else "" }}>
              {{ label }}
            </label>
            {% endfor %}
          </form>
        {% endcall %}
      </div>
      <p class="role-count" data-open-count>{{ total }} open role{{ "" if total == 1 else "s" }}</p>
    </div>

    {% if not total %}
    <p class="empty">
      {% if posted_range == "all" %}No roles found{% else %}No roles discovered {{ ranges[posted_range][1] }}{% endif %}{% if work_label != "Any" %} matching {{ work_label }}{% endif %}.
      {% if posted_range != "all" %}Try a wider range.{% endif %}
    </p>
    {% endif %}

    {% if skills_under %}
    <p class="more">
      {% if skills_all %}
      <span class="fg-text-secondary">Showing {{ skills_under }} role{{ "" if skills_under == 1 else "s" }} under your skills cutoff.</span>
      <a class="fg-link" href="/">Hide them</a>
      {% else %}
      <span class="fg-text-secondary">{{ skills_under }} role{{ " is" if skills_under == 1 else "s are" }} hidden by your skills cutoff.</span>
      <a class="fg-link" href="/?skills=all">Show them</a>
      {% endif %}
    </p>
    {% endif %}

    <ul class="postings">
      {% for p in postings %}
      <li class="posting" id="posting-{{ p.id }}">
        <div class="posting-lead">
          <p class="posting-title"><a class="posting-link" href="/open/{{ p.id }}" target="_blank" rel="noopener">{{ p.title }}</a></p>
          <p class="posting-subline">{{ p.company_name }}{% if p.location %} • {{ p.location }}{% endif %}</p>
          <p class="posting-source">Found on {{ p.ats_type|capitalize }}</p>
          {%- if p.skill_line %}
          <p class="posting-skills">{{ p.skill_line }}</p>
          {%- endif %}
        </div>
        <div class="posting-second">
          {# LinkedIn line ("Not seen on LinkedIn" / "Seen on LinkedIn 3 hours ago") goes here once LinkedIn sightings are recorded. #}
          <p class="posting-state" data-state>{% if p.viewed_ago %}Viewed {{ p.viewed_ago }}{% else %}Discovered {{ p.first_seen_at|humanize }}{% endif %}</p>
          <div class="row-action" data-action>
            {%- if p.asking %}{{ ask_actions(p.id) }}{% else %}{{ apply_button(p.id) }}{% endif %}
          </div>
        </div>
      </li>
      {% endfor %}
    </ul>

    {% if next_n %}
    <p class="more">
      <span class="fg-text-secondary">Showing {{ shown_count }} of {{ total }}</span>
      <a class="fg-link" href="/?n={{ next_n }}{% if skills_all %}&amp;skills=all{% endif %}">Show {{ page_size }} more</a>
    </p>
    {% endif %}

    {% else %}
    <div class="toolbar">
      <p class="role-count">Newest first</p>
      <p class="role-count">{{ applications|length }} application{{ "" if applications|length == 1 else "s" }}</p>
    </div>
    {% if not applications %}
    <div class="empty">
      <p class="fg-voice empty-title">No applications yet.</p>
      <p class="fg-card-help">When you apply to a role from Open roles, it moves here.</p>
    </div>
    {% endif %}
    <ul class="postings">
      {% for p in applications %}
      <li class="posting" id="posting-{{ p.id }}">
        <div class="posting-lead">
          <p class="posting-title"><a class="posting-link" href="/open/{{ p.id }}" target="_blank" rel="noopener">{{ p.title }}</a></p>
          <p class="posting-subline">{{ p.company_name }}{% if p.location %} • {{ p.location }}{% endif %}</p>
          <p class="posting-source">Found on {{ p.ats_type|capitalize }}</p>
        </div>
        <div class="posting-second">
          <p class="posting-state">Applied{% if p.applied_ago %} {{ p.applied_ago }}{% endif %}</p>
        </div>
      </li>
      {% endfor %}
    </ul>
    {% endif %}
    </div>
  </section>
  <div class="fg-toast-region" role="status" aria-live="polite" id="toast-region"></div>
</body>
</html>
