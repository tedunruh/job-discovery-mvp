{% import "_fg.html" as fg %}
{#- The things a card's action spot can say (SC-63, SC-59). They are drawn on the server for the rows that need them and also
    sit in <template>s, which the page's scripts copy, so the page and the scripts never disagree on markup. -#}
{% macro apply_group(id, title) -%}
<span class="fg-job-group"><a class="fg-button fg-button--secondary" href="/open/{{ id }}" target="_blank" rel="noopener" data-apply>Apply<span class="fg-visually-hidden"> (opens the posting in a new tab)</span></a><form method="post" action="/hide/{{ id }}" data-hide><button class="fg-button fg-button--ghost" type="submit">Hide<span class="fg-visually-hidden"> {{ title }}</span></button></form></span>
{%- endmacro %}
{% macro ask_actions(id) -%}
<p class="fg-voice fg-job-question">Did you apply?</p>
<span class="fg-job-group"><form method="post" action="/set_applied/{{ id }}" data-ask-yes><input type="hidden" name="applied" value="true"><button class="fg-button fg-button--secondary" type="submit">Yes</button></form><form method="post" action="/ask/dismiss/{{ id }}" data-ask-dismiss><button class="fg-button fg-button--secondary" type="submit">Not yet</button></form></span>
{%- endmacro %}
{% macro why_actions(id) -%}
<label class="fg-voice fg-job-question" for="why-{{ id }}">Why are you hiding?</label>
<span class="fg-job-group"><span class="fg-select fg-job-select"><select id="why-{{ id }}" data-why><option value="" disabled selected>Select</option><option value="role">Not my kind of role</option><option value="junior">Too junior</option><option value="senior">Too senior</option><option value="location">Location or remote setup</option><option value="pay">Pay</option><option value="company">Not interested in this company</option><option value="applied">Already applied</option><option value="other">Other</option></select><svg width="14" height="8" viewBox="0 0 14 8" fill="none" aria-hidden="true"><path d="M1 1L7 7L13 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><button class="fg-button fg-button--ghost" type="button" data-skip>Skip</button></span>
{%- endmacro %}
{% macro unhide_button(id, title, reason="") -%}
<form method="post" action="/unhide/{{ id }}" data-unhide data-reason="{{ reason }}"><button class="fg-button fg-button--secondary" type="submit">Unhide<span class="fg-visually-hidden"> {{ title }}</span></button></form>
{%- endmacro %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scout</title>
  {% include "_field_guide_head.html" %}
  <script src="/field-guide/js/filter.js" defer></script>
  <script src="/field-guide/js/toast.js" defer></script>
  <script src="/field-guide/js/job.js" defer></script>
  <script src="/field-guide/js/return.js" defer></script>
  <style>
    /* Layout follows Figma "Scout Job Discovery Dashboard" (226:849): a Sage band
       with topographic contours behind the header, then the list on the page surface inside a raised board. Each
       job is its own bordered card (Figma 355:1272). Page inset is 16px at the sides and 24px at the bottom; the page
       header sets the top. */
    body {
      position: relative;
      padding: 0 var(--fg-space-4) var(--fg-space-6); /* the page header sets the top space, as on every page */
    }
    body > :not(.band):not(.fg-toast-region) { position: relative; z-index: 1; }

    /* Decorative band: full width, 277px tall (Figma frame 226:850), clips the
       contours. The contour artwork keeps its Figma offset from the right edge. */
    .band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 277px;
      overflow: hidden;
      background: var(--fg-color-signal-support-subtle);
      pointer-events: none;
    }
    .topography {
      position: absolute;
      top: -28.5px;
      right: -92px;
      color: var(--fg-color-signal-attention-subtle);
    }

    /* The page header (fg.header) lines up with the content inside the board. */
    body > .fg-header { padding-inline: var(--fg-space-6); }

    .board {
      margin-top: calc(var(--fg-space-8) + var(--fg-space-1));
      padding: var(--fg-space-2) var(--fg-space-6) var(--fg-space-6);
      background: var(--fg-color-surface-page);
      border: 1px solid var(--fg-color-border-default);
      border-radius: var(--fg-radius-xl);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--fg-space-3) var(--fg-space-4);
      padding-bottom: var(--fg-space-2);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--fg-space-2);
    }
    .toolbar-end { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--fg-space-1) var(--fg-space-4); font-size: var(--fg-font-size-sm); }
    .toolbar-end .fg-link { white-space: nowrap; }
    .role-count {
      margin: 0;
      font-size: var(--fg-font-size-sm);
      font-weight: var(--fg-font-weight-medium);
      line-height: var(--fg-font-line-height-snug);
      color: var(--fg-color-text-secondary);
      white-space: nowrap;
    }

    .more {
      display: flex;
      align-items: center;
      gap: var(--fg-space-4);
      margin: var(--fg-space-4) 0 0 var(--fg-space-4);
      font-size: var(--fg-font-size-sm);
    }
    /* The list's footer: pagination pinned left, the hidden-jobs link pinned right (wraps on a phone). */
    .list-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--fg-space-2) var(--fg-space-4);
      margin-top: var(--fg-space-4);
    }
    .list-foot[hidden] { display: none; }
    .list-foot .more { margin: 0 0 0 var(--fg-space-4); }
    .list-foot-end { margin-left: auto; margin-right: var(--fg-space-4); font-size: var(--fg-font-size-sm); }
    .list-foot-end[hidden] { display: none; }
    .hidden-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--fg-space-2) var(--fg-space-4);
      padding-bottom: var(--fg-space-2);
    }
    .hidden-title { margin: 0; font-size: var(--fg-font-size-lg); font-weight: var(--fg-font-weight-demibold); color: var(--fg-color-text-primary); }
    .hidden-title:focus { outline: none; }
    /* Scout speaks: one Fraunces line on the band, above the board (SC-69). */
    .voice-intro {
      margin: var(--fg-space-2) 0 0;
      padding-inline: var(--fg-space-6);
      max-width: 720px;
      font-size: var(--fg-font-size-2xl);
      line-height: var(--fg-font-line-height-snug);
    }
    .voice-intro + .board { margin-top: var(--fg-space-6); }
    /* The caught-up state: Scout's words, with a faint piece of the contour line behind them (decorative). */
    .caught-up {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--fg-space-1);
      box-sizing: border-box;
      min-height: 220px;
      padding: var(--fg-space-12) var(--fg-space-4);
      overflow: hidden;
    }
    .caught-up .fg-voice, .caught-up .fg-card-help { position: relative; z-index: 1; max-width: 460px; }
    .caught-up .fg-card-help { margin: 0; }
    .caught-up .contour { position: absolute; right: -60px; top: -40px; width: 520px; opacity: 0.55; pointer-events: none; color: var(--fg-color-signal-attention-subtle); }
    .caught-up .contour svg { width: 100%; height: auto; display: block; }
    .empty {
      display: flex;
      flex-direction: column;
      gap: var(--fg-space-1);
      margin: 0;
      padding: var(--fg-space-8) var(--fg-space-4);
    }
    .empty-title { font-size: var(--fg-font-size-xl); }
    .empty .fg-card-help { margin: 0; }

    @media (max-width: 680px) {
      body > .fg-header { padding-inline: 0; }
      .board, .voice-intro + .board { margin-top: var(--fg-space-4); padding: var(--fg-space-1) var(--fg-space-3) var(--fg-space-3); }
      .voice-intro { padding-inline: 0; font-size: var(--fg-font-size-xl); }
      .caught-up .contour { width: 360px; right: -120px; }
      .more { margin-left: var(--fg-space-3); }
    }
  </style>
</head>
<body class="fg-page">
  <div class="band" aria-hidden="true">{% include "_topography.svg" %}</div>
  {% call fg.header(current=True) %}
    <a class="fg-button fg-button--ghost" href="/profile">Role preferences</a>
    <form method="post" action="/logout"><button class="fg-button fg-button--secondary" type="submit">Sign out</button></form>
  {% endcall %}
  <h1 class="fg-visually-hidden">Your jobs</h1>
  {%- if voice and tab == "open" and view == "open" %}
  <p class="fg-voice voice-intro" data-voice>{{ voice }}</p>
  {%- endif %}

  <section class="board" aria-label="Your jobs"{% if tab == "open" and view != "hidden" %} data-return-url="/return.json"{% endif %}{% if tab == "open" %} data-hide-board{% endif %}>
    {{ fg.tabs("Your jobs", [("Open roles", total, "/", tab == "open"), ("Applications", applications|length, "/?tab=applications", tab == "applications")]) }}
    {#- A live region that is always in the page, so a screen reader hears the question when it appears. -#}
    <p class="fg-visually-hidden" role="status" aria-live="polite" id="return-live"></p>
    <template id="return-apply-template">{{ apply_group("__id__", "__title__") }}</template>
    <template id="return-ask-template">{{ ask_actions("__id__") }}</template>
    <template id="return-why-template">{{ why_actions("__id__") }}</template>
    <template id="return-viewed-template">{{ fg.job_viewed() }}</template>
    <template id="toast-template">{% call fg.toast("You've applied to this role. You can find it in Applications.") %}<a class="fg-toast-action" href="/?tab=applications">View</a><button class="fg-toast-action" type="button" data-toast-undo>Undo</button>{% endcall %}</template>
    <template id="toast-simple-template">{% call fg.toast("__text__") %}<button class="fg-toast-action" type="button" data-toast-undo>Undo</button>{% endcall %}</template>

    <div role="tabpanel">
    {% if tab == "open" and view == "hidden" %}
    <div class="hidden-head">
      <h2 class="hidden-title" id="hidden-title" tabindex="-1" data-focus-on-load>Jobs you hid</h2>
      <a class="fg-link" href="/">Back to open roles</a>
    </div>
    {% if not hidden %}
    <div class="empty">
      <p class="fg-voice empty-title">Nothing hidden.</p>
      <p class="fg-card-help">Jobs you hide land here, in case you change your mind.</p>
    </div>
    {% endif %}
    <ul class="fg-job-list">
      {% for h in hidden %}
      {% call fg.job("posting-" ~ h.id, h.title, "/open/" ~ h.id, h.company_name, h.place, "Hidden " ~ h.hidden_ago, h.reason_label, mono=h.mono, tint=h.tint, pay=h.pay) %}
        {{- unhide_button(h.id, h.title, h.hidden_reason or "") -}}
      {% endcall %}
      {% endfor %}
    </ul>
    {% elif tab == "open" and view == "viewed" %}
    <div class="hidden-head">
      <h2 class="hidden-title" id="viewed-title" tabindex="-1" data-focus-on-load>Jobs you viewed</h2>
      <a class="fg-link" href="/">Back to open roles</a>
    </div>
    {% if not postings %}
    <div class="empty">
      <p class="fg-voice empty-title">Nothing viewed yet.</p>
      <p class="fg-card-help">Jobs you open from Scout land here, newest first, until you apply or hide them.</p>
    </div>
    {% endif %}
    <ul class="fg-job-list" data-viewed-list>
      {% for p in postings %}
      {% call fg.job("posting-" ~ p.id, p.title, "/open/" ~ p.id, p.company_name, p.place, "Discovered on " ~ p.ats_type|capitalize, "Opened " ~ p.opened_ago, mono=p.mono, tint=p.tint, pay=p.pay, fit_score=p.fit) %}
        {%- if p.asking %}{{ ask_actions(p.id) }}{% else %}{{ apply_group(p.id, p.title) }}{% endif %}
      {% endcall %}
      {% endfor %}
    </ul>
    {% elif tab == "open" %}
    <div class="toolbar">
      <div class="filters">
        {% call fg.filter("filter-work", "Work type", work_label) %}
          <form class="fg-menu" method="get" action="/">
            <input type="hidden" name="work_set" value="1">
            {% for key, label in work_type_options.items() %}
            <label class="fg-menu-item">
              <input class="fg-checkbox" type="checkbox" name="work" value="{{ key }}" onchange="this.form.submit()" {{ "checked" if key in work_types else "" }}>
              {{ label }}
            </label>
            {% endfor %}
          </form>
        {% endcall %}

        {% call fg.filter("filter-posted", "Posted", ranges[posted_range][1]) %}
          <form class="fg-menu" method="get" action="/">
            {% for key, (label, _, _) in ranges.items() %}
            <label class="fg-menu-item">
              <input class="fg-radio" type="radio" name="range" value="{{ key }}" onchange="this.form.submit()" {{ "checked" if key == posted_range else "" }}>
              {{ label }}
            </label>
            {% endfor %}
          </form>
        {% endcall %}
      </div>
      <div class="toolbar-end">
        <a class="fg-link" href="/?view=viewed" data-viewed-link>Viewed jobs</a>
        <p class="role-count" data-open-count>{{ total }} open role{{ "" if total == 1 else "s" }}</p>
      </div>
    </div>

    {% if caught_up %}
    <div class="caught-up" data-caught-up>
      <span class="contour" aria-hidden="true">{% include "_topography.svg" %}</span>
      <p class="fg-voice empty-title">You've been through everything new.</p>
      <p class="fg-card-help">I keep checking the boards, and I'll put anything that fits right here.</p>
    </div>
    {% elif not total %}
    <p class="empty">
      {% if posted_range == "all" %}No roles found{% else %}No roles discovered {{ ranges[posted_range][1] }}{% endif %}{% if work_label != "Any" %} matching {{ work_label }}{% endif %}.
      {% if posted_range != "all" %}Try a wider range.{% endif %}
    </p>
    {% endif %}

    {% if skills_under %}
    <p class="more">
      {% if skills_all %}
      <span class="fg-text-secondary">Showing {{ skills_under }} role{{ "" if skills_under == 1 else "s" }} under your skills cutoff.</span>
      <a class="fg-link" href="/">Hide them</a>
      {% else %}
      <span class="fg-text-secondary">{{ skills_under }} role{{ " is" if skills_under == 1 else "s are" }} hidden by your skills cutoff.</span>
      <a class="fg-link" href="/?skills=all">Show them</a>
      {% endif %}
    </p>
    {% endif %}

    {#- The jobs, grouped by when they were found (Today, Yesterday, Earlier this week, Earlier) with a true count each. -#}
    {% for label, count, rows in day_groups %}
    <section class="fg-day" aria-label="{{ label }}">
      {{ fg.day(label, count) }}
      <ul class="fg-job-list">
        {% for p in rows %}
        {% call fg.job("posting-" ~ p.id, p.title, "/open/" ~ p.id, p.company_name, p.place, "Discovered on " ~ p.ats_type|capitalize, p.when, p.viewed, skills=p.skill_line, mono=p.mono, tint=p.tint, pay=p.pay, fit_score=p.fit) %}
          {%- if p.asking %}{{ ask_actions(p.id) }}{% else %}{{ apply_group(p.id, p.title) }}{% endif %}
        {% endcall %}
        {% endfor %}
      </ul>
    </section>
    {% endfor %}

    {#- The footer: pagination on the left, the hidden-jobs link on the right once anything is hidden. The link is in the page
        from the start (hidden while there is nothing to show) so the script can reveal it when a job is hidden. -#}
    <div class="list-foot" data-foot{% if not next_n and not hidden %} hidden{% endif %}>
      {% if next_n %}
      <p class="more">
        <span class="fg-text-secondary">Showing {{ shown_count }} of {{ total }}</span>
        <a class="fg-link" href="/?n={{ next_n }}{% if skills_all %}&amp;skills=all{% endif %}">Show {{ page_size }} more</a>
      </p>
      {% endif %}
      <a class="fg-link list-foot-end" href="/?view=hidden" data-hidden-link{% if not hidden %} hidden{% endif %}>Show {{ hidden|length }} hidden job{{ "" if hidden|length == 1 else "s" }}</a>
    </div>

    {% else %}
    <div class="toolbar">
      <p class="role-count">Newest first</p>
      <p class="role-count">{{ applications|length }} application{{ "" if applications|length == 1 else "s" }}</p>
    </div>
    {% if not applications %}
    <div class="empty">
      <p class="fg-voice empty-title">No applications yet.</p>
      <p class="fg-card-help">When you apply to a role from Open roles, it moves here.</p>
    </div>
    {% endif %}
    <ul class="fg-job-list">
      {% for p in applications %}
      {{ fg.job("posting-" ~ p.id, p.title, "/open/" ~ p.id, p.company_name, p.place, "Applied" ~ ((" " ~ p.applied_ago) if p.applied_ago else ""), mono=p.mono, tint=p.tint, pay=p.pay) }}
      {% endfor %}
    </ul>
    {% endif %}
    </div>
  </section>
  <div class="fg-toast-region" role="status" aria-live="polite" id="toast-region"></div>
</body>
</html>
