services:
  - type: web
    name: job-discovery-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SECRET_KEY
        generateValue: true
