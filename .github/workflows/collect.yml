name: Collect job postings

on:
  # GitHub's own schedule trigger is unreliable at sub-hourly intervals - it gets
  # silently deprioritized and delayed (observed 2-6 hour gaps in practice despite
  # this being set to run every 30 min). The real 30-min cadence comes from an
  # external cron (cron-job.org) calling workflow_dispatch via the GitHub API
  # instead. This schedule is kept only as a low-frequency fallback.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scheduler/run_collectors.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
