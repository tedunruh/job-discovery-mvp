name: field-guide

on:
  pull_request:
    paths: ["field-guide/**"]
  push:
    branches: [main]
    paths: ["field-guide/**"]

jobs:
  tokens-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated tokens.css matches tokens/*.json
        run: python field-guide/build.py --check
